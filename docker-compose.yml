services:
  advisor:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"     # bind to localhost; put a TLS reverse proxy in front for remote access
    volumes:
      - advisor-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Optional local LLM. Start with: docker compose --profile ollama up
  # then set LLM_PROVIDER=ollama and OLLAMA_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  advisor-data:
  ollama-models:
